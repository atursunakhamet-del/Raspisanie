<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.svg"><title>Oqu — Әкімші құпиясөзін жаңарту</title><style>
:root{font-family:'Segoe UI',Arial,sans-serif;color:#172e38;background:#f3f7f6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{background:white;border:1px solid #dfe9e6;border-radius:22px;padding:36px;width:100%;max-width:480px;box-shadow:0 15px 50px #153e4509}.brand{font-size:32px;font-weight:750;color:#168478;text-decoration:none}h1{font-size:26px;line-height:1.25;letter-spacing:-.6px;margin:24px 0 12px}p{color:#687e83;line-height:1.6;font-size:14px}.account{padding:13px 15px;background:#edf6f1;border-radius:10px;color:#185b51;overflow-wrap:anywhere}.field{display:block;font-weight:600;font-size:13px;margin:20px 0 7px}.password{position:relative}input{width:100%;padding:14px 50px 14px 14px;font:inherit;border:1px solid #d7e2df;border-radius:10px}input:focus{outline:3px solid #b5ded4;border-color:#168478}.eye{position:absolute;right:5px;top:5px;width:40px;height:40px;border:0;background:transparent;color:#66817b;cursor:pointer;border-radius:8px}.eye svg{width:22px;height:22px}.eye[aria-pressed=true]{background:#e4f2ec}.submit,.login-link{width:100%;padding:14px 18px;border-radius:10px;border:0;background:#168478;color:white;font:600 15px 'Segoe UI',Arial;cursor:pointer;margin-top:20px;display:block;text-align:center;text-decoration:none}button:disabled{opacity:.6;cursor:wait}.error{color:#ae3832;font-size:13px;min-height:18px}.hint{font-size:12px}input[aria-invalid=true]{border-color:#ae3832;background:#fffafa}[hidden]{display:none!important}@media(max-width:500px){.card{padding:25px}h1{font-size:23px}}
</style><script src="/admin-recovery.js" defer></script></head><body><main class="card"><a class="brand" href="/planner">oqu.</a><h1>Әкімші құпиясөзін жаңарту</h1><p id="intro">Жеке сілтемені тексеріп жатырмыз…</p><div id="account" class="account" hidden></div><form id="recoveryForm" hidden novalidate><label class="field" for="next">Жаңа құпиясөз</label><div class="password"><input id="next" name="next" type="password" required minlength="10" maxlength="128" autocomplete="new-password" aria-describedby="nextError"><button class="eye" type="button" data-for="next" aria-label="Жаңа құпиясөзді көрсету" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><div id="nextError" class="error" aria-live="polite"></div><label class="field" for="repeat">Жаңа құпиясөзді қайталаңыз</label><div class="password"><input id="repeat" name="repeat" type="password" required minlength="10" maxlength="128" autocomplete="new-password" aria-describedby="repeatError"><button class="eye" type="button" data-for="repeat" aria-label="Қайталанған құпиясөзді көрсету" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><div id="repeatError" class="error" aria-live="polite"></div><p class="hint">Кемінде 10 таңба енгізіңіз. Құпиясөзді осы бетте өзіңіз орнатыңыз. Сақтағаннан кейін сілтеме қайта қолданылмайды.</p><button id="submit" class="submit" type="submit">Жаңа құпиясөзді сақтау</button></form><p id="status" class="error" role="status"></p><a id="loginLink" class="login-link" href="/planner" hidden>Кіру бетіне өту →</a></main></body></html>
